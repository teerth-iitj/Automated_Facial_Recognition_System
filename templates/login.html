{% extends "base.html" %}
{% block title %}Sign in - Face Attendance{% endblock %}
{% block content %}
<section class="card" style="max-width: 430px; margin: 3rem auto">
  <h1>Sign in</h1>
  <p class="muted">Use your administrator or faculty account to manage attendance.</p>
  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <p id="message" class="notice" role="status"></p>
</section>
{% endblock %}
{% block scripts %}
<script>
  const form = document.getElementById("login-form");
  const message = document.getElementById("message");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = form.querySelector("button");
    button.disabled = true;
    try {
      const result = await api("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: form.username.value,
          password: form.password.value
        })
      });
      window.location.assign(result.redirect);
    } catch (error) {
      showMessage(message, error.message, true);
    } finally {
      button.disabled = false;
    }
  });
</script>
{% endblock %}
